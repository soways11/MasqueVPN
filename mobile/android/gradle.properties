# AndroidX. Прямых зависимостей от него больше нет (AppCompat убран), но флаг
# оставлен: без него сборка останавливается, стоит любой будущей библиотеке
# потянуть AndroidX за собой, — а вреда от него нет.
android.useAndroidX=true

# Каждый модуль получает свой R-класс вместо общего на все зависимости:
# быстрее сборка, меньше метода. Умолчание в новых AGP, но пишем явно.
android.nonTransitiveRClass=true

# Память демону Gradle. 2 ГБ хватает этому проекту с запасом; без строки
# демон берёт умолчание JVM, которого на больших сборках не хватает.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей. Модуль здесь один, но флаг не мешает и
# пригодится, когда появится второй (например, отдельный модуль ядра).
org.gradle.parallel=true

# Kotlin со стилем официальной кодовой базы — иначе предупреждение на каждой
# сборке.
kotlin.code.style=official
